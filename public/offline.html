<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Tidak ada koneksi · TAP by Haluan</title>
    <!--
      Gaya inline, tanpa satu pun berkas eksternal.

      Halaman ini justru dipakai ketika jaringan mati, jadi apa pun yang perlu
      diambil dari server akan gagal. Itu pula alasan berkas ini tinggal di
      public/ dan bukan menjadi rute Next: rute akan menautkan chunk CSS dan JS
      yang tidak ikut di-cache service worker, sehingga halaman offline-nya
      tampil tanpa gaya sama sekali.

      Warnanya dikutip literal dari BRAND-SYSTEM.md §2.1 karena berkas ini
      tidak bisa membaca token di tokens.css.
    -->
    <style>
      :root {
        color-scheme: light dark;
        --paper: #fcfcfc;
        --ink: #090a0a;
        --muted: #5c5f66;
        --line: rgba(9, 10, 10, 0.12);
        --cta: #d60069;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --paper: #090a0a;
          --ink: #fcfcfc;
          --muted: #a2a5ab;
          --line: rgba(252, 252, 252, 0.14);
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px calc(24px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom))
          calc(24px + env(safe-area-inset-left));
        background: var(--paper);
        color: var(--ink);
        font-family: "Open Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      main {
        width: min(420px, 100%);
        text-align: center;
      }

      /* Marka Haluan TAP, SVG inline. Halaman ini justru dipakai ketika
         jaringan mati, jadi ia tidak boleh bergantung pada berkas mana pun
         yang harus diambil dari server. */
      .mark {
        width: 64px;
        height: 64px;
        display: block;
        margin: 0 auto 24px;
      }

      h1 {
        margin: 0 0 12px;
        font-family: Poppins, system-ui, sans-serif;
        font-size: clamp(24px, 5vw, 30px);
        font-weight: 700;
        letter-spacing: -0.02em;
        text-wrap: balance;
      }

      p {
        margin: 0 0 28px;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.6;
        text-wrap: pretty;
      }

      a.retry {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        padding: 0 28px;
        border-radius: 999px;
        background: var(--cta);
        color: #ffffff;
        font-size: 15px;
        font-weight: 600;
        text-decoration: none;
      }

      a.retry:hover {
        filter: brightness(1.08);
      }

      a.retry:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <svg class="mark" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><defs><linearGradient id="hot" gradientUnits="userSpaceOnUse" x1="0" y1="-702" x2="1842" y2="0"><stop offset="0" stop-color="#fb007f"/><stop offset="1" stop-color="#d226c7"/></linearGradient></defs><g transform="translate(22.40 345.03) scale(0.25364)"><path d="M567 -702V-565H381V0H210V-565H24V-702Z" fill="url(#hot)" stroke="url(#hot)" stroke-width="82" stroke-linejoin="round"/><path d="M1035 -124H773L731 0H552L806 -702H1004L1258 0H1077ZM991 -256 904 -513 818 -256Z" fill="url(#hot)" stroke="url(#hot)" stroke-width="82" stroke-linejoin="round"/><path d="M1557 -252H1451V0H1280V-702H1557Q1641 -702 1699 -673Q1757 -644 1786 -593Q1815 -542 1815 -476Q1815 -415 1787 -364.5Q1759 -314 1701 -283Q1643 -252 1557 -252ZM1641 -476Q1641 -518 1617 -541Q1593 -564 1544 -564H1451V-388H1544Q1593 -388 1617 -411Q1641 -434 1641 -476Z" fill="url(#hot)" stroke="url(#hot)" stroke-width="82" stroke-linejoin="round"/></g></svg>
      <h1>Tidak ada koneksi</h1>
      <p>
        TAP menampilkan komisi dan status sample yang berubah setiap hari, jadi halaman ini tidak
        disimpan offline. Sambungkan kembali internet, lalu coba lagi.
      </p>
      <!--
        Tautan biasa, bukan tombol ber-JavaScript.

        CSP situs ini memakai `script-src 'self' 'nonce-…' 'strict-dynamic'`,
        dan proxy.ts memasangnya juga pada berkas di public/. Skrip inline apa
        pun di sini akan diblokir tanpa suara, sehingga tombolnya justru tidak
        melakukan apa-apa persis ketika ia paling dibutuhkan. Navigasi biasa
        tidak butuh skrip sama sekali: kalau jaringan sudah pulih halaman
        aslinya terbuka, kalau belum service worker menyajikan halaman ini lagi.
      -->
      <a class="retry" href="/deals">Coba lagi</a>
    </main>
  </body>
</html>
